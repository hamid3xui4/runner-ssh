name: ssh-runner

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'مدت زنده ماندن (دقیقه)'
        required: false
        default: '350'
      chain:
        description: 'اجرای خودکار رانر بعدی (yes/no)'
        required: false
        default: 'yes'
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: ssh-runner
  cancel-in-progress: false

env:
  HOSTNAME_TS: gha-ubuntu

defaults:
  run:
    shell: bash

jobs:
  runner:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: setup-ssh
        timeout-minutes: 6
        env:
          ROOT_PASS: ${{ secrets.SSH_ROOT_PASS }}
          PUBKEY: ${{ secrets.SSH_PUBKEY }}
        run: |
          set +e +o pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get -qq update
          sudo apt-get -qq install -y openssh-server sshpass curl net-tools >/dev/null
          sudo mkdir -p /run/sshd

          echo "root:$ROOT_PASS" | sudo chpasswd
          sudo passwd -u root >/dev/null 2>&1

          # کاربر پشتیبان با sudo بدون پسورد
          if ! id hamid >/dev/null 2>&1; then sudo useradd -m -s /bin/bash hamid; fi
          echo "hamid:$ROOT_PASS" | sudo chpasswd
          echo 'hamid ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/99-hamid >/dev/null
          sudo chmod 440 /etc/sudoers.d/99-hamid

          if [ -n "${PUBKEY:-}" ]; then
            for u in /root /home/hamid; do
              sudo install -d -m 700 "$u/.ssh"
              echo "$PUBKEY" | sudo tee "$u/.ssh/authorized_keys" >/dev/null
              sudo chmod 600 "$u/.ssh/authorized_keys"
            done
          fi

          sudo mkdir -p /etc/ssh/sshd_config.d
          cat > /tmp/00-runner.conf <<'EOF'
          PermitRootLogin yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PubkeyAuthentication yes
          UsePAM yes
          X11Forwarding yes
          MaxSessions 50
          ClientAliveInterval 60
          ClientAliveCountMax 1000
          EOF
          sed -i 's/^          //' /tmp/00-runner.conf
          sudo install -m 644 /tmp/00-runner.conf /etc/ssh/sshd_config.d/00-runner.conf
          grep -q '^Include /etc/ssh/sshd_config.d' /etc/ssh/sshd_config \
            || echo 'Include /etc/ssh/sshd_config.d/*.conf' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo ssh-keygen -A >/dev/null

          echo "=== تنظیمات مؤثر sshd ==="
          sudo sshd -T 2>/dev/null | grep -Ei '^(permitrootlogin|passwordauthentication|usepam|kbdinteractiveauthentication|pubkeyauthentication|authenticationmethods) ' | sort

          # /run/sshd باید حتماً وجود داشته باشد وگرنه sshd بالا نمی‌آید
          sudo install -d -m 0755 -o root -g root /run/sshd
          sudo install -d -m 0755 -o root -g root /var/run/sshd
          echo "privil-sep dir: $(ls -ld /run/sshd)"
          sudo /usr/sbin/sshd -t && echo "config test: OK" || echo "config test: FAIL"

          # sshd پیش‌فرض ایمیج، تنظیمات ما را ندارد -> باید جایگزین شود
          echo "sshd فعلی: $(ps -eo args | grep -E '[s]shd' | head -2)"
          sudo pkill -x sshd
          sleep 2
          : | sudo tee /tmp/sshd.log >/dev/null
          sudo bash -c 'exec /usr/sbin/sshd -D -e >>/tmp/sshd.log 2>&1' &
          sleep 4
          if ! ss -ltn | grep -qE ':22\s'; then
            echo "تلاش دوم..."
            sudo install -d -m 0755 /run/sshd
            sudo /usr/sbin/sshd -E /tmp/sshd2.log
            sleep 3
          fi
          echo "sshd processes: $(pgrep -c sshd)"
          echo "sshd فعلی: $(ps -eo args | grep -E '[s]shd' | head -2)"
          if ss -ltn | grep -E ':22\s'; then echo PORT22_OK; else echo PORT22_FAIL; fi
          echo "--- لاگ sshd ---"
          sudo tail -20 /tmp/sshd.log 2>/dev/null
          sudo tail -20 /tmp/sshd2.log 2>/dev/null
          exit 0

      - name: verify-ssh
        timeout-minutes: 4
        env:
          ROOT_PASS: ${{ secrets.SSH_ROOT_PASS }}
        run: |
          set +e +o pipefail
          O="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o NumberOfPasswordPrompts=1"
          echo "=== تست ۱: ورود root با پسورد ==="
          sshpass -p "$ROOT_PASS" ssh $O -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            root@127.0.0.1 'echo ROOT_LOGIN_OK; whoami; lsb_release -ds' 2>&1 | tail -5
          echo "=== تست ۲: ورود hamid با پسورد ==="
          sshpass -p "$ROOT_PASS" ssh $O -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            hamid@127.0.0.1 'echo HAMID_LOGIN_OK; whoami; sudo -n whoami' 2>&1 | tail -5
          echo "=== وضعیت hash پسورد (قفل نبودن) ==="
          echo "root  : $(sudo getent shadow root | cut -d: -f2 | cut -c1-4)"
          echo "hamid : $(sudo getent shadow hamid | cut -d: -f2 | cut -c1-4)"
          echo "=== چه پروسه‌ای به ۲۲ گوش می‌دهد ==="
          sudo ss -ltnp | grep -E ':22\s'
          ps -eo pid,ppid,args | grep -E '[s]shd'
          echo "=== لاگ sshd ==="
          sudo tail -20 /tmp/sshd.log 2>/dev/null || echo "بدون لاگ"
          echo "=== auth.log ==="
          sudo tail -20 /var/log/auth.log 2>/dev/null | tail -12 || echo "بدون auth.log"
          echo "=== ssh -v (بخش احراز هویت) ==="
          sshpass -p "$ROOT_PASS" ssh -v $O -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            root@127.0.0.1 true 2>&1 | grep -iE 'authentications that can continue|Next authentication|denied|succeeded|Server accepts key' | head -8
          exit 0

      - name: setup-tailscale
        timeout-minutes: 8
        env:
          TSKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TSAPI: ${{ secrets.TAILSCALE_API_TOKEN }}
        run: |
          set +e +o pipefail
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          sudo mkdir -p /var/run/tailscale /var/lib/tailscale
          printf '#!/bin/bash\nexec tailscale --socket=/var/run/tailscale/tailscaled.sock "$@"\n' \
            | sudo tee /usr/local/bin/ts >/dev/null
          sudo chmod +x /usr/local/bin/ts
          sudo sysctl -w net.ipv6.conf.all.forwarding=1 >/dev/null 2>&1
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null 2>&1

          if [ -n "$TSAPI" ]; then
            for id in $(curl -s -m 25 -u "$TSAPI:" "https://api.tailscale.com/api/v2/tailnet/-/devices" \
              | jq -r --arg h "$HOSTNAME_TS" '.devices[]? | select(.hostname==$h and .connectedToControl==false) | .id'); do
              echo "delete old node $id -> $(curl -s -m 20 -o /dev/null -w '%{http_code}' -X DELETE -u "$TSAPI:" "https://api.tailscale.com/api/v2/device/$id")"
            done
          fi

          sudo nohup tailscaled --tun=userspace-networking --socket=/var/run/tailscale/tailscaled.sock \
               --statedir=/var/lib/tailscale >/tmp/tailscaled.log 2>&1 &
          for i in $(seq 1 25); do sudo ts status >/dev/null 2>&1 && break; sleep 1; done
          sudo -E ts up --authkey="$TSKEY" --hostname="$HOSTNAME_TS" --reset \
               --advertise-exit-node --accept-routes=false --accept-dns=false 2>&1 | tail -5
          sleep 3
          TS_IP=$(sudo ts ip -4 | head -1)
          FQ=$(sudo ts status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')
          { echo "TS_IP=$TS_IP"; echo "FQDN=$FQ"; } >> "$GITHUB_ENV"
          echo "TAILSCALE IP = $TS_IP   FQDN = $FQ"
          sudo ts status | head -8
          exit 0

      - name: setup-funnel
        timeout-minutes: 10
        run: |
          set +e +o pipefail
          mkdir -p /tmp/status && cd /tmp/status
          printf '<!doctype html><meta charset=utf-8><title>runner</title><h1>Ubuntu 22.04 runner</h1><pre>host: %s\nts ip: %s\ntime: %s</pre>\n' \
            "$(hostname)" "${TS_IP:-n/a}" "$(date -u)" > index.html
          nohup python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          sleep 2
          sudo install -d -m 0755 /run/sshd

          echo "۱۰ ثانیه صبر تا گره در control plane پایدار شود"
          sleep 10

          logf() { echo "----- $1 -----"; cat "$2" 2>/dev/null | tail -16; }

          is_pub() { sudo ts funnel status 2>&1 | grep -qi 'Funnel on\|internet'; }

          echo "=== تلاش برای Funnel روی پورت ۱۰۰۰۰ (SSH) ==="
          for i in 1 2 3 4; do
            timeout 120 sudo ts funnel --bg --tls-terminated-tcp=10000 tcp://127.0.0.1:22 >/tmp/f_ssh.log 2>&1
            rc=$?
            logf "attempt#$i rc=$rc" /tmp/f_ssh.log
            sleep 6
            is_pub && { echo "FUNNEL-SSH OK"; break; }
            timeout 60 sudo ts serve --tls-terminated-tcp=10000 off >/dev/null 2>&1
            timeout 60 sudo ts funnel --tls-terminated-tcp=10000 off >/dev/null 2>&1
            sleep 6
          done

          echo "=== تلاش برای Funnel (یک‌بار؛ روی رانر GitHub معمولاً به دلیل userspace-networking کار نمی‌کند) ==="
          timeout 90 sudo ts funnel --bg --tls-terminated-tcp=10000 tcp://127.0.0.1:22 >/tmp/f_ssh.log 2>&1
          logf "funnel-ssh rc=$?" /tmp/f_ssh.log
          timeout 90 sudo ts funnel --bg --https=8443 http://127.0.0.1:8080 >/tmp/f_web.log 2>&1
          logf "funnel-web rc=$?" /tmp/f_web.log
          sleep 4

          # اگر funnel عمومی نشد، serve را مطمئن کن (دسترسی از گوشی داخل tailnet)
          if ! sudo ts funnel status 2>&1 | grep -qi 'Funnel on'; then
            echo "funnel فعال نشد -> serve (داخل tailnet)"
            timeout 90 sudo ts serve --bg --tls-terminated-tcp=10000 tcp://127.0.0.1:22 >/tmp/s_ssh.log 2>&1
            timeout 90 sudo ts serve --bg --https=8443 --set-path=/ http://127.0.0.1:8080 >/tmp/s_web.log 2>&1
          fi
          # اطمینان از اینکه sshd و وب همچنان بالا هستند
          sudo install -d -m 0755 /run/sshd
          ss -ltn | grep -qE ':22\s' || { sudo bash -c 'nohup /usr/sbin/sshd -D -e >>/tmp/sshd.log 2>&1 &'; sleep 3; }
          curl -s -m 3 -o /dev/null http://127.0.0.1:8080/ || { (cd /tmp/status && nohup python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &); sleep 2; }
          sleep 3
          echo "=== serve status ==="
          sudo ts serve status 2>&1 | head -25 | tee /tmp/serve_status.txt
          echo "=== funnel status ==="
          sudo ts funnel status 2>&1 | head -25 | tee /tmp/funnel_status.txt

          if ! is_pub; then
            echo "Funnel عمومی نشد -> serve برای دسترسی داخل tailnet"
            timeout 90 sudo ts serve --bg --tls-terminated-tcp=10000 tcp://127.0.0.1:22 >/tmp/s_ssh.log 2>&1
            timeout 90 sudo ts serve --bg --https=8443 --set-path=/ http://127.0.0.1:8080 >/tmp/s_web.log 2>&1
            cat /tmp/s_ssh.log | tail -6
          fi
          sleep 2
          echo "=== وضعیت نهایی ==="
          sudo ts funnel status 2>&1 | head -25 | tee /tmp/funnel_final.txt
          if is_pub; then echo "FUNNEL_PUBLIC=yes" >> "$GITHUB_ENV"; else echo "FUNNEL_PUBLIC=no" >> "$GITHUB_ENV"; fi
          echo "FUNNEL_SSH=ssh -p 10000 -o StrictHostKeyChecking=no root@${FQDN}" >> "$GITHUB_ENV"
          echo "FUNNEL_WEB=https://${FQDN}:8443/" >> "$GITHUB_ENV"
          echo "FUNNEL_WEB443=https://${FQDN}/" >> "$GITHUB_ENV"
          exit 0

      - name: self-check
        continue-on-error: true
        timeout-minutes: 6
        env:
          ROOT_PASS: ${{ secrets.SSH_ROOT_PASS }}
        run: |
          set +e +o pipefail
          O="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o NumberOfPasswordPrompts=1 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          R=0
          echo "### 1) پورت 22"
          ss -ltn | grep -E ':22\s' >/dev/null && echo OK1 || { echo FAIL1; R=1; }
          echo "### 2) ورود root با پسورد"
          OUT=$(sshpass -p "$ROOT_PASS" ssh $O root@127.0.0.1 'echo LOGIN_OK $(whoami)' 2>&1)
          echo "$OUT" | tail -3
          case "$OUT" in *LOGIN_OK*) echo OK2;; *) echo FAIL2; [ $R -eq 0 ] && R=2;; esac
          echo "### 3) ورود hamid با پسورد"
          OUT3=$(sshpass -p "$ROOT_PASS" ssh $O hamid@127.0.0.1 'echo HAMID_OK $(sudo -n whoami)' 2>&1)
          echo "$OUT3" | tail -3
          case "$OUT3" in *HAMID_OK*) echo OK3;; *) echo FAIL3;; esac
          echo "### 4) tailscale ip"
          sudo ts ip -4 | head -1 && echo OK4 || { echo FAIL4; [ $R -eq 0 ] && R=4; }
          echo "### 5) exit node"
          if sudo ts status 2>&1 | grep -q 'offers exit node'; then echo "OK5 - exit node فعال"; else echo WARN5; fi
          echo "### 6) پورت 10000 از طریق IP tailscale (TLS)"
          cat > /tmp/probe.py <<'PY'
          import socket, ssl, sys
          host, port = sys.argv[1], int(sys.argv[2])
          for mode in ("raw", "tls"):
              try:
                  s = socket.create_connection((host, port), timeout=15)
                  if mode == "tls":
                      c = ssl.create_default_context(); c.check_hostname = False; c.verify_mode = ssl.CERT_NONE
                      s = c.wrap_socket(s, server_hostname=host)
                  s.settimeout(15)
                  b = s.recv(120).decode(errors="replace").strip(); s.close()
                  if b:
                      print(mode.upper() + "-OK banner=" + b); sys.exit(0)
              except Exception as e:
                  print(mode + " failed: " + type(e).__name__ + ": " + str(e))
          print("NO-BANNER"); sys.exit(1)
          PY
          python3 /tmp/probe.py "$TS_IP" 10000 && echo OK6 || echo WARN6
          echo "### 7) پورت 22 از طریق IP tailscale"
          python3 /tmp/probe.py "$TS_IP" 22 && echo OK7 || echo WARN7
          echo "### 8) funnel عمومی"
          if [ "${FUNNEL_PUBLIC:-no}" = "yes" ]; then
            python3 /tmp/probe.py "$FQDN" 10000 && echo OK8 || echo WARN8
            echo "web -> $(curl -s -m 20 -o /dev/null -w '%{http_code}' "https://$FQDN:8443/")"
          else
            echo "WARN8 - funnel عمومی فعال نیست"
          fi
          echo "### جمع‌بندی"
          [ "$R" = "0" ] && echo ALL_CORE_TESTS_PASSED || echo "CORE_FAILURE_AT_STEP_$R"
          echo "CHECK_RESULT=$R" >> "$GITHUB_ENV"
          exit 0

      - name: publish-info
        timeout-minutes: 4
        env:
          PAT: ${{ secrets.GH_PAT }}
          ROOT_PASS: ${{ secrets.SSH_ROOT_PASS }}
        run: |
          set +e +o pipefail
          TS_IP=$(sudo ts ip -4 | head -1)
          FQ=$(sudo ts status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')
          O="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o NumberOfPasswordPrompts=1 -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          A=$(sshpass -p "$ROOT_PASS" ssh $O root@127.0.0.1 'echo ROOT_LOGIN_OK' 2>&1)
          B=$(sshpass -p "$ROOT_PASS" ssh $O hamid@127.0.0.1 'echo HAMID_LOGIN_OK' 2>&1)
          case "$A" in *ROOT_LOGIN_OK*) RT="موفق ✅";; *) RT="ناموفق ❌";; esac
          case "$B" in *HAMID_LOGIN_OK*) HT="موفق ✅";; *) HT="ناموفق ❌";; esac
          sudo ts status 2>&1 | grep -q 'offers exit node' && EX="فعال ✅" || EX="غيرفعال ❌"
          if sudo ts funnel status 2>&1 | grep -qi 'Funnel on'; then
            FU="در CLI فعال است، ولی از اینترنت تست نشد ⚠️ (رانر GitHub ورودی بیرونی ندارد)"
          else
            FU="فقط serve داخل tailnet ⚠️"
          fi
          TOTAL="${{ github.event.inputs.minutes }}"; [ -z "$TOTAL" ] && TOTAL=350
          ENDT=$(date -u -d "@$(( $(date +%s) + (TOTAL-8)*60 ))" '+%H:%M' 2>/dev/null || echo '-')

          MAIN_HOST="$TS_IP"; MAIN_PORT="22"; MAIN_LABEL="Tailscale (راه اصلی و تضمین‌شده)"

          {
            echo '# اطلاعات اتصال سرور'
            echo
            echo '> با هر اجرای جدید خودکار به‌روز می‌شود.'
            echo
            echo '| مورد | مقدار |'
            echo '|---|---|'
            echo "| آخرین به‌روزرسانی | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
            echo "| کاربر / پسورد | \`root\` / \`$ROOT_PASS\` |"
            echo "| کاربر پشتیبان | \`hamid\` / \`$ROOT_PASS\` (با sudo) |"
            echo "| IP داخل Tailscale | \`$TS_IP\` |"
            echo "| نام گره | \`$HOSTNAME_TS\` = \`$FQ\` |"
            echo "| Exit node | $EX |"
            echo "| Funnel | $FU |"
            echo "| تست ورود root با پسورد | $RT |"
            echo "| تست ورود hamid با پسورد | $HT |"
            echo "| پایان تقریبی این اجرا | $ENDT UTC |"
            echo
            echo "## راه اصلی — $MAIN_LABEL"
            echo '```bash'
            echo "ssh -p $MAIN_PORT root@$MAIN_HOST"
            echo '```'
            echo
            echo '## همهٔ راه‌ها'
            echo '```bash'
            echo "# ۱) از طریق Tailscale (پیشنهادی)"
            echo "ssh root@$TS_IP"
            echo "ssh hamid@$TS_IP        # سپس: sudo -i"
            echo
            echo "# ۲) از طریق پورت ۱۰۰۰۰ (serve/funnel)"
            echo "ssh -p 10000 -o StrictHostKeyChecking=no root@$FQ"
            echo '```'
            echo "صفحهٔ وضعیت داخل tailnet: https://$FQ:8443/"
            echo
            echo '## Exit node روی گوشی'
            echo "اپ Tailscale → منو → Exit node → \`$HOSTNAME_TS\`"
          } > /tmp/CONNECTION.md
          cat /tmp/CONNECTION.md

          # گزارش تشخیصی
          {
            echo '# گزارش تشخیصی'
            echo
            echo '```'
            echo "date: $(date -u)"
            echo "-- sshd -T --"
            sudo sshd -T 2>&1 | grep -Ei '^(permitrootlogin|passwordauthentication|kbdinteractive|usepam|authenticationmethods|allowusers|denyusers) ' | sort
            echo "-- passwd -S --"
            sudo passwd -S root 2>&1; sudo passwd -S hamid 2>&1
            echo "-- تست root --"; echo "$A"
            echo "-- تست hamid --"; echo "$B"
            echo "-- hash پسورد (باید با $ شروع شود، نه ! یا *) --"
            echo "root: $(sudo getent shadow root | cut -d: -f2 | cut -c1-4)"
            echo "hamid: $(sudo getent shadow hamid | cut -d: -f2 | cut -c1-4)"
            echo "-- pam.d/sshd --"
            sudo grep -vE '^\s*(#|$)' /etc/pam.d/sshd 2>&1 | head -12
            echo "-- pam.d/common-auth --"
            sudo grep -vE '^\s*(#|$)' /etc/pam.d/common-auth 2>&1 | head -12
            echo "-- پروسه‌های sshd --"
            ps -eo pid,args | grep -E '[s]shd' | head -5
            echo "-- لاگ sshd --"
            sudo tail -25 /tmp/sshd.log 2>&1
            echo "-- auth.log --"
            sudo tail -18 /var/log/auth.log 2>&1 | tail -12
            echo "-- ts status --"
            sudo ts status 2>&1 | head -8
            echo "-- tags --"
            sudo ts status --json 2>&1 | jq -c '{Tags:.Self.Tags,DNSName:.Self.DNSName,Online:.Self.Online}' 2>&1
            echo "-- serve status --"
            sudo ts serve status 2>&1 | head -20
            echo "-- funnel status --"
            sudo ts funnel status 2>&1 | head -20
            echo "-- تلاش‌های funnel (ssh) --"
            cat /tmp/f_ssh.log 2>&1 | tail -16
            echo "-- تلاش‌های funnel (web 8443) --"
            cat /tmp/f_web.log 2>&1 | tail -12
            echo "-- تلاش‌های funnel (web 443) --"
            cat /tmp/f_443.log 2>&1 | tail -12
            echo "-- fallback serve --"
            cat /tmp/s_ssh.log 2>&1 | tail -8
            echo "-- resolve عمومی --"
            getent hosts "$FQ" 2>&1 || echo NXDOMAIN
            echo '```'
          } > /tmp/DIAG.md

          publish() {
            f="$1"; name="$2"
            b64=$(base64 -w0 "$f")
            sha=$(curl -s -m 20 -H "Authorization: token $PAT" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$name" | jq -r '.sha // empty')
            [ -n "$sha" ] && ex=",\"sha\":\"$sha\"" || ex=""
            curl -s -m 30 -o /dev/null -w "publish $name -> HTTP %{http_code}\n" -X PUT \
              -H "Authorization: token $PAT" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$name" \
              -d "{\"message\":\"update $name\",\"content\":\"$b64\",\"branch\":\"main\"$ex}"
          }
          publish /tmp/CONNECTION.md CONNECTION.md
          publish /tmp/DIAG.md DIAG.md
          exit 0

      - name: keep-alive
        timeout-minutes: 355
        env:
          TSKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set +e +o pipefail
          TOTAL="${{ github.event.inputs.minutes }}"
          [ -z "$TOTAL" ] && TOTAL=350
          CHAIN="${{ github.event.inputs.chain }}"
          [ -z "$CHAIN" ] && CHAIN=yes
          LIFE=$(( TOTAL - 8 ))
          ENDS=$(( $(date +%s) + LIFE*60 ))
          echo "این رانر $LIFE دقیقه زنده می‌ماند و سپس رانر بعدی را راه می‌اندازد (chain=$CHAIN)."
          while [ "$(date +%s)" -lt "$ENDS" ]; do
            if ! pgrep -x tailscaled >/dev/null; then
              sudo nohup tailscaled --tun=userspace-networking --socket=/var/run/tailscale/tailscaled.sock --statedir=/var/lib/tailscale >/tmp/tailscaled.log 2>&1 &
              sleep 4
              sudo -E ts up --authkey="$TSKEY" --hostname="$HOSTNAME_TS" --reset --advertise-exit-node --accept-dns=false >/dev/null 2>&1
              echo "[$(date -u +%H:%M)] tailscaled بازیابی شد"
            fi
            if ! ss -ltn | grep -qE ':22\s'; then
              sudo install -d -m 0755 /run/sshd
              sudo bash -c 'nohup /usr/sbin/sshd -D -e >>/tmp/sshd.log 2>&1 &'
              sleep 3
              echo "[$(date -u +%H:%M)] sshd بازیابی شد"
            fi
            if ! curl -s -m 3 -o /dev/null http://127.0.0.1:8080/; then
              (cd /tmp/status && nohup python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/http.log 2>&1 &)
              sleep 2
              echo "[$(date -u +%H:%M)] سرویس وب بازیابی شد"
            fi
            if ! sudo ts funnel status 2>&1 | grep -qi 'Funnel on'; then
              sudo install -d -m 0755 /run/sshd
              timeout 90 sudo ts funnel --bg --tls-terminated-tcp=10000 tcp://127.0.0.1:22 >/dev/null 2>&1
              timeout 90 sudo ts funnel --bg --https=8443 http://127.0.0.1:8080 >/dev/null 2>&1
              echo "[$(date -u +%H:%M)] funnel بازیابی شد"
            fi
            echo "[$(date -u +%H:%M)] alive | ts=$(sudo ts ip -4 2>/dev/null | head -1) | sshd=$(pgrep -c sshd 2>/dev/null || echo 0)"
            sleep 60
          done
          echo "عمر این رانر تمام شد — راه‌اندازی رانر بعدی"
          if [ "$CHAIN" = "yes" ]; then
            for i in 1 2 3; do
              code=$(curl -s -m 25 -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: token ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ssh.yml/dispatches" \
                -d "{\"ref\":\"main\",\"inputs\":{\"minutes\":\"$TOTAL\",\"chain\":\"yes\"}}")
              echo "dispatch تلاش $i -> HTTP $code"
              [ "$code" = "204" ] && break
              sleep 5
            done
          else
            echo "chain غیرفعال است."
          fi
          exit 0
